<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Smile Dental Studio — Chat</title>
<style>
  :root {
    --accent: #6366f1; --accent-dark: #4f46e5; --bg: #f4f4f8;
    --bubble-user: #6366f1; --bubble-agent: #ffffff; --text: #1f2937;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; min-height: 100vh;
  }
  .chat {
    width: 100%; max-width: 560px; display: flex; flex-direction: column;
    height: 100vh; background: #fff; box-shadow: 0 0 24px rgba(0,0,0,.08);
  }
  header {
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: #fff; padding: 16px 20px;
  }
  header h1 { margin: 0; font-size: 1.05rem; }
  header p { margin: 2px 0 0; font-size: .8rem; opacity: .85; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; background: var(--bg);
  }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px;
         line-height: 1.45; font-size: .92rem; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--bubble-user); color: #fff;
          border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: var(--bubble-agent);
           border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  .typing { opacity: .6; font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e5e7eb; }
  input {
    flex: 1; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 10px;
    font-size: .95rem; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 0 18px; font-size: .95rem; cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="chat">
  <header>
    <h1>Bright Smile Dental Studio</h1>
    <p>AI Secretary — ask about services, prices, hours, or book an appointment</p>
  </header>
  <div id="messages"></div>
  <form id="form">
    <input id="input" placeholder="Type a message…" autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  let sessionId = null;

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  addMessage("Hi! I'm the AI Secretary for Bright Smile Dental Studio. I can answer questions about our services, prices, and hours — or book you an appointment. How can I help?", "agent");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMessage(text, "user");
    const typing = addMessage("Typing…", "agent typing");
    sendBtn.disabled = true;
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      const data = await res.json();
      typing.remove();
      if (!res.ok) {
        addMessage("Sorry, something went wrong: " + (data.detail || res.status), "agent");
      } else {
        sessionId = data.session_id;
        addMessage(data.reply, "agent");
      }
    } catch (err) {
      typing.remove();
      addMessage("Sorry, I couldn't reach the server. Is it running?", "agent");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
